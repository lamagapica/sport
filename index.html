<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Misión Iregua</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#10170f">
<style>
:root{--bg:#10170f;--card:#1a251a;--ac:#e9b44c;--g:#7fb069;--t:#eef2e6;--m:#93a58a;--r:#d9695f}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--t);font:15px/1.4 system-ui,sans-serif;padding-bottom:90px}
header{padding:14px 16px;background:linear-gradient(#22331f,#10170f);position:sticky;top:0;z-index:5}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.rank{font-weight:700;color:var(--ac)}.m{color:var(--m);font-size:13px}
.bar{height:8px;background:#2b3a28;border-radius:5px;overflow:hidden;margin:6px 0}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--g),var(--ac));transition:width .4s}
main{padding:12px 16px;max-width:640px;margin:auto}
h2{margin:6px 0 10px;font-size:20px}
.card{background:var(--card);border-radius:14px;padding:12px;margin-bottom:12px}
.row{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap;align-items:center}
input,select{background:#0e150d;color:var(--t);border:1px solid #33452f;border-radius:9px;padding:9px;font-size:15px;min-width:0;flex:1}
button{font:inherit;cursor:pointer}
.btn{background:var(--ac);color:#1b1500;border:0;border-radius:9px;padding:9px 14px;font-weight:700}
.x{background:none;border:0;color:var(--r);float:right}
.set{padding:6px 0;border-bottom:1px solid #263525}
.chip{display:inline-block;background:#2b3a28;border-radius:20px;padding:3px 10px;margin:2px;font-size:13px}
.chip.on{background:var(--ac);color:#1b1500;font-weight:700}
.mis{display:flex;gap:10px;align-items:center;padding:6px 0}
.ok{color:var(--g)}.bad{color:var(--r)}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:#0b110a;border-top:1px solid #263525;z-index:10}
nav button{flex:1;background:none;border:0;color:var(--m);padding:10px 0;font-size:11px}
nav button b{display:block;font-size:20px;font-weight:400}
nav .on{color:var(--ac)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.cal div{background:var(--card);border-radius:8px;padding:6px 0;min-height:48px;font-size:13px;cursor:pointer}
.cal .h{background:none;min-height:0;color:var(--m);cursor:default}
.cal .sel{outline:2px solid var(--ac)}.cal .full{background:#35502d}
canvas{width:100%;height:180px;display:block}
label.ck{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid #263525}
label.ck input{flex:none;width:22px;height:22px}
button.chip{color:var(--t);border:0;font:inherit;font-size:13px;cursor:pointer}
.clk{font-size:40px;font-weight:700;text-align:center;color:var(--ac)}
.gr{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.tile{aspect-ratio:1;font-size:28px;background:#2b3a28;border:0;border-radius:10px;color:var(--t)}
.arena{position:relative;height:220px;background:#0b110a;border-radius:12px;overflow:hidden}
.ff{position:absolute;font-size:32px;background:none;border:0;animation:gl 1s infinite alternate}
@keyframes gl{to{transform:scale(1.3)}}
.sm{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sm .btn{padding:16px;font-size:18px}
.sb{height:80px;border:0;border-radius:14px;transition:opacity .15s}
.br{width:140px;height:140px;margin:10px auto;border-radius:50%;background:radial-gradient(var(--g),#2b3a28)}
.big{font-size:20px;text-align:center;padding:8px;font-weight:600}
.macro-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px;text-align:center}
.macro-box{background:#0e150d;border:1px solid #33452f;border-radius:8px;padding:6px;font-size:12px}
.quiz-opt{display:grid;grid-template-columns:1fr;gap:8px;margin-top:10px}
.quiz-btn{background:#0e150d;border:1px solid #33452f;color:var(--t);padding:12px;border-radius:9px;text-align:left;font-size:14px;transition:background .2s}
.quiz-btn:active{background:#2b3a28}
.quiz-feedback{text-align:center;font-weight:700;margin-top:8px;min-height:24px}
.prot-alert{background:#223e25;border:1px solid var(--g);color:#b3ffb3;padding:6px 10px;border-radius:8px;margin-top:8px;font-size:12px;text-align:center;font-weight:600}
.rpe-select{display:flex;gap:4px;margin-top:4px}
.rpe-btn{background:#0e150d;border:1px solid #33452f;color:var(--t);border-radius:6px;padding:4px 8px;font-size:12px}
.rpe-btn.on{background:var(--ac);color:#1b1500;font-weight:bold;border-color:var(--ac)}
.rec-target{background:#1c2d20;border-left:3px solid var(--g);padding:6px 10px;font-size:13px;margin:6px 0;border-radius:0 8px 8px 0}
#rest-modal{position:fixed;bottom:50px;left:0;right:0;background:#141f14;border-top:2px solid var(--ac);padding:10px 16px;z-index:20;box-shadow:0 -5px 15px rgba(0,0,0,0.5);display:none}
</style></head><body>
<header>
 <div class="top"><span class="rank" id="rk"></span><span id="st"></span></div>
 <div class="bar"><i id="xb"></i></div>
 <div class="m" id="xt"></div>
</header>
<main id="app"></main>
<nav id="nav"></nav>
<datalist id="fl"></datalist>

<!-- Banner / Modal flotante de descanso -->
<div id="rest-modal">
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">
    <div style="font-weight:bold;color:var(--ac)">⏱️ Rest: <span id="m-clk">3:00</span></div>
    <button class="btn" style="padding:4px 10px;font-size:12px" id="m-close">✕ Cerrar</button>
  </div>
  <div id="m-game-area" style="max-height:200px;overflow:y-auto"></div>
</div>

<script>
if('serviceWorker' in navigator){
  navigator.serviceWorker.register('sw.js').catch(()=>{});
}

const K='mision-iregua',$=s=>document.querySelector(s),
E=(t,c,h)=>{const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e},
esc=s=>String(s).replace(/[&<>"']/g,c=>'&#'+c.charCodeAt(0)+';');

let db={logs:{},food:{},post:{},extra:{},quests:{},weather:{},weeklyChall:{},kcal:2200,water:{},theme:'iregua',rest:{},hs:{}};
try{Object.assign(db,JSON.parse(localStorage.getItem(K)||'{}'))}catch(e){}

const THEMES={
  iregua:{'--bg':'#10170f','--card':'#1a251a','--ac':'#e9b44c','--g':'#7fb069','--t':'#eef2e6','--m':'#93a58a','--r':'#d9695f'},
  otoño:{'--bg':'#1a0f0d','--card':'#2b1a17','--ac':'#e9734c','--g':'#d9a25f','--t':'#f2eee6','--m':'#a5918a','--r':'#d95f5f'},
  noche:{'--bg':'#0d131a','--card':'#17202b','--ac':'#4cbce9','--g':'#5f9ed9','--t':'#e6edf2','--m':'#8aa2a5','--r':'#d95f6f'}
};

function applyTheme(name){
  const t=THEMES[name]||THEMES.iregua;
  const root=document.documentElement;
  Object.entries(t).forEach(([k,v])=>root.style.setProperty(k,v));
}
applyTheme(db.theme);

const save=()=>{try{localStorage.setItem(K,JSON.stringify(db))}catch(e){}};
const fmt=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const pd=s=>{const[a,b,c]=s.split('-');return new Date(a,b-1,c)};
let cur=fmt(new Date()),view='hoy',cm=new Date(),pex='',stopFn=null;cm.setDate(1);

const R={push:{n:'Empuje · Puente del Tronco',i:'🛡️',ex:['Flexiones','Press militar','Rompecráneos 90°']},
pull:{n:'Tirón · Forja del Río',i:'🏹',ex:['Remo unilateral','Curl de bíceps','Curl inclinado','Curl martillo']},
legs:{n:'Pierna · Ascenso de Piedras',i:'⛰️',ex:['Sentadilla','Zancada','Puente de glúteo','Elevación de talones']},
rest:{n:'Descanso activo · Paseo del Iregua',i:'🌿',ex:[]}};
const TY=['rest','push','pull','legs','push','pull','rest'];
const type=d=>TY[pd(d).getDay()],exs=t=>[...R[t].ex,...(db.extra[t]||[])];
const POST=['Retroversión pélvica tumbada · 2×15 (aguanta 3 s)','Puente de glúteo con pelvis retrovertida · 3×12','Dead bug · 3×8 por lado','Gato-vaca · 2×10','Retracción cervical (mentón atrás) · 2×10','Wall angels · 2×10','Plancha con pelvis retrovertida · 3×20 s','Estiramiento de flexores de cadera · 2×30 s por lado'];
const Q=['Hoy el río suena a favor tuyo.','Cada serie es un paso más en tu propia leyenda.','La disciplina es una forma de cariño hacia la versión de ti de dentro de un año.','Luz de mañana, tronco firme, piedras bajo los pies: eso ya es una aventura.','No hace falta motivación: hay un camino y tú sabes recorrerlo.','Pequeñas victorias, grandes historias.','Tu cuerpo es tu campamento base: cuídalo y te llevará lejos.'];

const RANKS=[
  {lv:1,n:'Aprendiz del Iregua',desc:'Desbloqueado al iniciar el camino'},
  {lv:3,n:'Exploradora del Soto',desc:'Desbloqueado en Nivel 3'},
  {lv:5,n:'Guardiana del Tronco',desc:'Desbloqueado en Nivel 5'},
  {lv:8,n:'Cazadora de Amaneceres',desc:'Desbloqueado en Nivel 8'},
  {lv:12,n:'Señora del Río',desc:'Desbloqueado en Nivel 12'},
  {lv:15,n:'Leyenda del Camino',desc:'Desbloqueado al alcanzar la maestría total'}
];

const WEATHER_OPTS=[
  {id:'sun',i:'☀️',n:'Mañana despejada'},
  {id:'wind',i:'💨',n:'Viento del norte'},
  {id:'river',i:'💧',n:'Frescor de río'},
  {id:'leaves',i:'🍂',n:'Hojas caídas y calma'}
];

const RECETAS_FRECUENTES=[
  {n:'Batido de leche y plátano', k:230, p:9, c:40, f:3},
  {n:'Macarrones con queso, atún y maíz', k:520, p:32, c:65, f:14},
  {n:'Tortilla de 2 huevos con jamón', k:280, p:20, c:1, f:22},
  {n:'Yogur/Skyr con frutos secos y miel', k:260, p:18, c:22, f:10},
  {n:'Tostadas de aguacate y huevo', k:380, p:14, c:30, f:22}
];

const FOODS={
  'Arroz cocido':{k:130,p:2.7,c:28,f:0.3},'Pasta cocida':{k:150,p:5,c:25,f:1.1},'Pan':{k:265,p:9,c:49,f:3.2},
  'Pan integral':{k:250,p:13,c:41,f:3.5},'Avena':{k:370,p:13,c:60,f:7},'Pechuga de pollo':{k:165,p:31,c:0,f:3.6},
  'Ternera':{k:200,p:26,c:0,f:10},'Huevo':{k:143,p:13,c:0.7,f:10},'Atún en lata':{k:130,p:28,c:0,f:1},
  'Salmón':{k:208,p:20,c:0,f:13},'Lentejas cocidas':{k:116,p:9,c:20,f:0.4},'Garbanzos cocidos':{k:164,p:9,c:27,f:2.6},
  'Patata cocida':{k:87,p:2,c:20,f:0.1},'Plátano':{k:89,p:1.1,c:23,f:0.3},'Manzana':{k:52,p:0.3,c:14,f:0.2},
  'Naranja':{k:47,p:0.9,c:12,f:0.1},'Leche':{k:46,p:3.4,c:4.8,f:1.5},'Yogur natural':{k:61,p:3.5,c:4.7,f:3.3},
  'Skyr':{k:63,p:11,c:4,f:0.2},'Queso fresco':{k:98,p:11,c:3.4,f:4.3},'Aguacate':{k:160,p:2,c:9,f:15},
  'Aceite de oliva':{k:884,p:0,c:0,f:100},'Frutos secos':{k:600,p:20,c:20,f:50},'Crema de cacahuete':{k:600,p:25,c:20,f:50},
  'Tomate':{k:18,p:0.9,c:3.9,f:0.2},'Verdura':{k:30,p:2,c:5,f:0.3},'Chocolate negro':{k:550,p:8,c:45,f:35},
  'Jamón serrano':{k:240,p:30,c:0,f:13},'Tortilla de patata':{k:190,p:7,c:15,f:11},'Hummus':{k:230,p:8,c:20,f:14}
};
$('#fl').innerHTML=Object.keys(FOODS).map(f=>`<option value="${f}">`).join('');

const score=s=>s.reduce((a,x)=>a+x.r*(x.w>0?x.w:1),0);
function prev(ex,date){const d=Object.keys(db.logs).filter(k=>k<date&&(db.logs[k][ex]||[]).length).sort().pop();return d?{d,s:db.logs[d][ex]}:null}
const hasT=d=>Object.values(db.logs[d]||{}).some(a=>a.length);
const kc=d=>(db.food[d]||[]).reduce((a,f)=>a+f.k,0);
const getMacros=d=>(db.food[d]||[]).reduce((acc,f)=>{acc.p+=f.p||0;acc.c+=f.c||0;acc.f+=f.f||0;return acc},{p:0,c:0,f:0});
const active=d=>hasT(d)||(db.food[d]||[]).length||(db.post[d]||[]).length;
const mis=d=>({t:type(d)==='rest'||hasT(d),p:(db.post[d]||[]).length>=4,f:(db.food[d]||[]).length>=1});
const full=d=>{const m=mis(d);return m.t&&m.p&&m.f&&active(d)};

function stats(){db.rest=db.rest||{};db.hs=db.hs||{};let sets=0,fo=0,po=0,days=0,qxp=0;
Object.keys(db.logs).forEach(d=>Object.values(db.logs[d]).forEach(a=>sets+=a.length));
Object.keys(db.food).forEach(d=>fo+=db.food[d].length);Object.keys(db.post).forEach(d=>po+=db.post[d].length);
new Set([...Object.keys(db.logs),...Object.keys(db.food),...Object.keys(db.post)]).forEach(d=>{if(full(d))days++});
let st=0,d=new Date();if(!active(fmt(d)))d.setDate(d.getDate()-1);
while(active(fmt(d))){st++;d.setDate(d.getDate()-1)}
return{sets,fo,po,days,st,xp:sets*10+fo*5+po*8+days*40+Object.values(db.rest).reduce((a,b)=>a+b,0)*10+qxp}}

function head(){const s=stats(),l=Math.floor(Math.sqrt(s.xp/40))+1,a=40*(l-1)**2,b=40*l*l;
const currentRank = [...RANKS].reverse().find(r=>l>=r.lv) || RANKS[0];
$('#rk').textContent=`Nv ${l} · ${currentRank.n}`;
$('#st').textContent=`🔥 ${s.st} día${s.st==1?'':'s'}`;
$('#xb').style.width=Math.min(100,(s.xp-a)/(b-a)*100)+'\%';$('#xt').textContent=`${s.xp} XP · faltan ${b-s.xp} para el nivel ${l+1}`}

const NAV=[['hoy','🗺️','Hoy'],['ent','🏋️','Entreno'],['com','🍽️','Comida'],['pos','🧘','Postura'],['cal','📅','Calendario'],['des','⏱️','Descanso'],['pro','📈','Progreso']];
function render(){head();$('#nav').innerHTML='';NAV.forEach(([k,i,n])=>{const b=E('button',k==view?'on':'',`<b>${i}</b>${n}`);b.onclick=()=>{view=k;render();scrollTo(0,0)};$('#nav').append(b)});
if(stopFn)stopFn();stopFn=null;const a=$('#app');a.innerHTML='';
const dp=E('input');dp.type='date';dp.value=cur;dp.onchange=()=>{if(dp.value){cur=dp.value;render()}};
if(view!='cal'&&view!='pro'&&view!='des')a.append(dp);
a.append({hoy:vHoy,ent:vTrain,com:vFood,pos:vPost,cal:vCal,des:vRest,pro:vProg}[view]())}

// Widget SVG de Campamento Evolutivo
function renderCampWidget(){
  const s=stats(), l=Math.floor(Math.sqrt(s.xp/40))+1;
  const wId=db.weather[cur]||'sun';
  
  let skyColor="#1a2e3b";
  let weatherSvg="";
  if(wId==='sun'){ skyColor="#223d52"; weatherSvg='<circle cx="260" cy="40" r="18" fill="#e9b44c" opacity="0.8"/>'; }
  else if(wId==='wind'){ weatherSvg='<path d="M100 30 Q140 20 180 30 M150 45 Q190 35 230 45" stroke="#93a58a" stroke-width="2" fill="none" opacity="0.5"/>'; }
  else if(wId==='river'){ skyColor="#17313b"; weatherSvg='<path d="M0 100 Q150 90 300 105" stroke="#4cbce9" stroke-width="8" fill="none" opacity="0.3"/>'; }
  else if(wId==='leaves'){ weatherSvg='<text x="50" y="40" font-size="12">🍂</text><text x="220" y="60" font-size="12">🍂</text>'; }

  // Evolución del campamento por niveles
  let items = `<polygon points="120,100 150,50 180,100" fill="#2b3a28" stroke="#3d5239" stroke-width="2"/>`; // Tienda básica
  if(l >= 3){ items += `<circle cx="200" cy="95" r="8" fill="#555"/><path d="M200 95 L200 85 M197 90 L203 90" stroke="#ff7700" stroke-width="3"/>`; } // Fuego
  if(l >= 5){ items += `<rect x="70" y="85" width="20" height="15" fill="#4a3525"/>`; } // Herramientas / Tronco
  if(l >= 8){ items += `<polygon points="240,100 255,60 270,100" fill="#2b3a28"/>`; } // Segunda tienda / Estandarte
  if(l >= 12){ items += `<path d="M40 100 L40 70 L55 80 Z" fill="#e9b44c"/>`; } // Tótem / Bandera

  return `<svg viewBox="0 0 300 110" style="width:100%;background:${skyColor};border-radius:12px;margin-bottom:10px;">
    ${weatherSvg}
    <path d="M0 85 Q150 75 300 85 L300 110 L0 110 Z" fill="#141f13"/>
    ${items}
    <text x="10" y="20" fill="#eef2e6" font-size="10" font-weight="bold">Campamento Base · Nv ${l}</text>
  </svg>`;
}

function vHoy(){const w=E('div'),t=type(cur),m=mis(cur),s=stats(),doy=Math.floor(pd(cur)/864e5);
w.append(E('h2','',`${R[t].i} ${R[t].n}`));
w.innerHTML += renderCampWidget();
w.append(E('div','card',`<i>“${Q[doy%Q.length]}”</i>`));

db.weather=db.weather||{};
const currentW=db.weather[cur]||'sun';
const wcCard=E('div','card','<b>🌦️ Entorno del Iregua</b><div class="m" style="margin-bottom:6px">¿Cómo está el ambiente hoy junto al río?</div>');
const rowW=E('div','row');
WEATHER_OPTS.forEach(wo=>{
  const chip=E('button','chip'+(currentW==wo.id?' on':''),`${wo.i} ${wo.n}`);
  chip.onclick=()=>{db.weather[cur]=wo.id;save();render()};
  rowW.append(chip);
});
wcCard.append(rowW);
w.append(wcCard);

db.water=db.water||{};
const waterCount=db.water[cur]||0;
const waterCard=E('div','card',`<b>💧 Hidratación diaria: <span style="color:var(--ac)">${waterCount} vasos</span></b><div class="m" style="margin-bottom:8px">Suma vasos de agua fresca para cumplir tus metas.</div>`);
const waterRow=E('div','row');
const btnMinus=E('button','btn','- Quitar');btnMinus.onclick=()=>{if(waterCount>0){db.water[cur]=waterCount-1;save();render()}};
const btnPlus=E('button','btn','+ 1 Vaso de agua');btnPlus.onclick=()=>{db.water[cur]=waterCount+1;save();render()};
waterRow.append(btnMinus,btnPlus);waterCard.append(waterRow);w.append(waterCard);

const c=E('div','card','<b>Misiones del día</b>');
[[m.t,t==='rest'?'Descanso activo: camina junto al río':'Completar el entreno ('+exs(t).length+' ejercicios)'],[m.p,'Postura y pelvis (mín. 4 ejercicios)'],[m.f,'Registrar tu comida']].forEach(([o,x])=>c.append(E('div','mis',`<span class="${o?'ok':'m'}">${o?'✅':'⬜'}</span>${x}`)));
c.append(E('div','m',full(cur)?'¡Día perfecto! +40 XP ✨':'Completa las 3 misiones para el bonus de +40 XP'));w.append(c);

const L=[['Primera serie',s.sets>=1],['Racha 3',s.st>=3],['Racha 7',s.st>=7],['Racha 30',s.st>=30],['100 series',s.sets>=100],['Día perfecto',s.days>=1],['10 días perfectos',s.days>=10]];
w.append(E('div','card','<b>Logros</b><br>'+L.map(([n,o])=>`<span class="chip ${o?'on':''}">${o?'🏆':'🔒'} ${n}</span>`).join('')));return w}

function vTrain(){const w=E('div'),t=type(cur);w.append(E('h2','',`${R[t].i} ${R[t].n}`));
if(!exs(t).length)w.append(E('p','m','Hoy toca descanso activo. Haz la rutina de postura y pasea. Si quieres, entrena igualmente desde otro día.'));
exs(t).forEach(ex=>{
  const L=(db.logs[cur]||{})[ex]||[],p=prev(ex,cur),c=E('div','card',`<b>${esc(ex)}</b>`);
  
  // Recomendación automática de objetivo
  if(p && p.s.length > 0){
    const last = p.s[p.s.length-1];
    const recReps = last.r + 2;
    c.append(E('div','rec-target',`🎯 <b>Objetivo de hoy:</b> La última vez hiciste ${last.w}kg × ${last.r} reps. Hoy intenta: <b>${last.w}kg × ${recReps} reps</b>.`));
  }

  L.forEach((s,i)=>{
    const rpeText = s.rpe ? ` · <span style="color:var(--ac)">${s.rpe}</span>` : '';
    const r=E('div','set',`Serie ${i+1}: <b>${s.w} kg × ${s.r} reps</b>${rpeText}`),b=E('button','x','✕');
    b.onclick=()=>{L.splice(i,1);if(!L.length)delete db.logs[cur][ex];save();render()};
    r.append(b);c.append(r);
  });

function line(cv,pts){const x=cv.getContext('2d'),W=cv.width=cv.clientWidth*2,H=cv.height=360;x.clearRect(0,0,W,H);x.font='24px sans-serif';x.fillStyle='#93a58a';
if(!pts.length){x.fillText('Aún sin datos',20,60);return}
const ys=pts.map(p=>p[1]);let mx=Math.max(...ys),mn=Math.min(...ys);if(mx==mn){mx+=1;mn-=1}
const X=i=>40+(pts.length>1?i/(pts.length-1):.5)*(W-80),Y=v=>H-50-(v-mn)/(mx-mn)*(H-110);
pts.forEach((p,i)=>{if(i){x.strokeStyle=p[1]>=pts[i-1][1]?(p[1]>pts[i-1][1]?'#7fb069':'#e9b44c'):'#d9695f';x.lineWidth=4;x.beginPath();x.moveTo(X(i-1),Y(pts[i-1][1]));x.lineTo(X(i),Y(p[1]));x.stroke()}
x.fillStyle='#eef2e6';x.beginPath();x.arc(X(i),Y(p[1]),7,0,7);x.fill()});
x.fillStyle='#93a58a';x.fillText(pts[0][0].slice(5),10,H-12);x.fillText(pts.at(-1)[0].slice(5),W-90,H-12);x.fillText(Math.round(mx),10,30)}

function bars(cv,arr,goal){const x=cv.getContext('2d'),W=cv.width=cv.clientWidth*2,H=cv.height=360;x.clearRect(0,0,W,H);
const mx=Math.max(goal,...arr.map(a=>a[1]))*1.1,bw=W/arr.length;
arr.forEach((a,i)=>{x.fillStyle=a[1]>=goal*.9?'#7fb069':'#e9b44c';const h=a[1]/mx*(H-50);x.fillRect(i*bw+4,H-30-h,bw-8,h)});
x.strokeStyle='#eef2e6';x.setLineDash([8,8]);x.beginPath();x.moveTo(0,H-30-goal/mx*(H-50));x.lineTo(W,H-30-goal/mx*(H-50));x.stroke();x.setLineDash([])}

// Lógica del mini-modal flotante de descanso
let modalIv = null, modalCleanup = null;
function openRestModal(){
  const modal = $('#rest-modal');
  const clk = $('#m-clk');
  const area = $('#m-game-area');
  modal.style.display = 'block';
  
  if(modalIv) clearInterval(modalIv);
  if(modalCleanup) modalCleanup();
  
  let end = Date.now() + 180000;
  let game = db.lastGame || 'mem';
  let score = 0;
  
  const sc = n => { score += n; };
  modalCleanup = GAMES[game](area, sc);
  
  modalIv = setInterval(()=>{
    const l = Math.max(0, end - Date.now()), s = Math.ceil(l / 1000);
    clk.textContent = Math.floor(s/60) + ':' + String(s%60).padStart(2,'0');
    if(l <= 0){
      clearInterval(modalIv);
      if(modalCleanup) modalCleanup();
      const t = fmt(new Date()); db.rest[t] = (db.rest[t]||0) + 1; save(); head();
      area.innerHTML = '<div class="big">¡Descanso terminado! 💪</div>';
      beep();
    }
  }, 1000);
}

$('#m-close').onclick = ()=>{
  $('#rest-modal').style.display = 'none';
  if(modalIv) clearInterval(modalIv);
  if(modalCleanup) modalCleanup();
};

const sc=n=>{score+=n;inf.textContent=`Puntos: ${score} · récord ${Math.max(score,db.hs[game]||0)}`};

end=Date.now()+18e4;bs.textContent='■ Terminar ya';run();
const tick=()=>{const l=Math.max(0,end-Date.now()),s=Math.ceil(l/1000);clk.textContent=Math.floor(s/60)+':'+String(s%60).padStart(2,'0');

iv=setInterval(tick,250)};
inf.textContent='Récord: '+(db.hs[game]||0);w.append(c,pk,bs,ar);return w}
render();
